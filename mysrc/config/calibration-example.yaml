# One shared IMU/camera correction is optimized over every pair below.
flight_name: piper01

# A single path also works (see calibration-cimenterie.yaml). With a
# mapping like this one, pass --imu-source safire (or loa) on the command
# line; the chosen source is appended to 'output' and 'work_dir' below.
imu:
  safire: /path/to/piper01_safire.gpkg
  loa: /path/to/piper01_loa.gpkg
int_param: /path/to/io/piper01_int_param.yaml
dem: /path/to/dem/piper01_dem_1m.tif
output: imu_camera_calibration.json
work_dir: /tmp/orthority_imu_calibration

# Initial physical correction. Bounds below are offsets around this correction.
initial_xyz: [0.0, 0.0, 0.0]
initial_opk: [0.0, 0.0, 0.0]
initial_step_xyz: [0.5, 0.5, 0.5]
initial_step_opk: [0.5, 0.5, 0.5]
# Choose one optimization mode:
optimize_parameters: [omega, phi, kappa]
# optimize_parameters: [x, y, z, omega, phi, kappa]
xyz_bounds:
  # Relative offsets from initial_xyz.
  - [-10.0, 10.0]
  - [-10.0, 10.0]
  - [-10.0, 10.0]
opk_bounds:
  # Relative offsets from initial_opk.
  - [-20.0, 20.0]
  - [-20.0, 20.0]
  - [-30.0, 30.0]

max_dimension: 2048
# Use differential evolution for a broad scan, then Nelder-Mead for refinement.
# The population size is rounded up internally for the Sobol initialization.
global_optimizer: differential_evolution
global_iterations: 20
global_population: 5
global_tolerance: 0.01
global_mutation: [0.5, 1.0]
global_recombination: 0.7
screening_seed: 42
full_optimization_starts: 1
max_iterations: 300
# Different-image pairs have no overlap cost above this fraction. Same-image
# pairs always penalize symmetric footprint IoU below 1 to match perimeters.
minimum_overlap: 0.5
overlap_penalty: 0.5
parameter_tolerance: 0.001
cost_tolerance: 0.0001

# Keep one item for single-image calibration; add items for multi-image calibration.
pairs:
  - image: /path/to/tif_f1/f1-000000001.tif
    reference: /path/to/tif_f1_ortho/f1-000000001_modified.tif
    image_band: 1
    reference_band: 1
    weight: 1.0
