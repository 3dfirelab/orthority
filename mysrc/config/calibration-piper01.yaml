# One shared IMU/camera correction is optimized over every pair below.
flight_name: az260002
imu:
  safire: /data/shared/PIPER/az260002/safire/az260002_safire.gpkg
  loa: /data/shared/PIPER/az260002/safire/piper01_psbga_gpgga_sync.gpkg
  safire_post: /data/shared/PIPER/az260002/safire/az260002_safire_postprocessed.gpkg
int_param: /data/shared/PIPER/az260002/Transects/001_320256_safire/io/az260002_int_param.yaml
dem: /data/shared/PIPER/az260002/dem/az260002_dem_1m.tif
output: /data/shared/PIPER/az260002/Transects/001_320256_<imu>/imu_camera_calibration_<imu>.json
work_dir: /tmp/orthority_imu_calibration_001
pose_model: legacy_coupled  #separate_lever_arm_boresight or legacy_coupled

# Physical initial values and bounds.
initial_xyz: [0.0, 0.0, 0.0]
initial_opk: [0.0, 0.0, 0.0]
initial_step_xyz: [0.1, 0.1, 0.1]
initial_step_opk: [0.1, 0.1, 0.1]
# Choose one optimization mode:
optimize_parameters: [omega, phi, kappa]
# optimize_parameters: [x, y, z, omega, phi, kappa]
starting_corrections:
  # Relative deltas from initial_xyz / initial_opk.
  - xyz: [0.0, 0.0, 0.0]
    opk: [0.0, 0.0, 0.0]
#  - xyz: [0.34, 0.48, 0.25]
#    opk: [-0.08, 0.05, 0.08]
#  - xyz: [0.0, 0.0, 0.0]
#    opk: [-0.08, 0.0, 0.0]
#  - xyz: [0.0, 0.0, 0.0]
#    opk: [0.0, 0.0, -0.08]
xyz_bounds:
  - [-2.0, 2.0]
  - [-2.0, 2.0]
  - [-1.0, 1.0]
opk_bounds:
  - [-3., 3.]
  - [-3., 3.]
  - [-5., 5.]

max_dimension: 2048
global_optimizer: differential_evolution
global_iterations: 20
global_population: 5
global_tolerance: 0.01
global_mutation: [0.5, 1.0]
global_recombination: 0.7
# These settings are used only when global_optimizer is multistart.
#screening_iterations: 2
#screening_samples: 0

screening_seed: 42
# Refine the best global candidate with Nelder-Mead.
full_optimization_starts: 1
max_iterations: 300
overlap_penalty: 0.5
parameter_tolerance: 0.001
cost_tolerance: 0.0001

# Keep one item for single-image calibration; add items for multi-image calibration.
pairs:
  - image: /data/shared/PIPER/az260002/Transects/001_320256_safire/tif_f1/f1-000000062.tif
    reference: /data/shared/PIPER/az260002/Transects/001_320256_safire/tif_f1_ortho/f1-000000062_modified.tif
    image_band: 1
    reference_band: 1
    weight: 1.0
  - image: /data/shared/PIPER/az260002/Transects/001_320256_safire/tif_f1/f1-000000950.tif
    reference: /data/shared/PIPER/az260002/Transects/001_320256_safire/tif_f1_ortho/f1-000000950_modified.tif
      # - image: /data/shared/PIPER/az260002/Transects/001_320256_safire/tif_f1/f1-000001009.tif
      #reference: /data/shared/PIPER/az260002/Transects/001_320256_safire/tif_f1_ortho/f1-000001009_modified.tif
    image_band: 1
    reference_band: 1
    weight: 1.0
